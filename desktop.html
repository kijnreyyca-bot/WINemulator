<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#008080">
  <title>WINemulator — Windows in your browser</title>
  <meta name="description" content="A fast, offline, no-install Windows 98, Windows XP and Windows 7 desktop environment that runs entirely in your browser. Files, Paint, Minesweeper, CMD, PowerShell, Virtual PC and more.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="WINemulator">
  <meta property="og:description" content="A complete Windows-style desktop in your browser. Choose Windows 98, Windows XP or Windows 7. Boots in seconds, works offline, no installs.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/apps.css">
  <link rel="stylesheet" href="css/xp.css">
  <link rel="stylesheet" href="css/win7.css">
  <link rel="stylesheet" href="css/win10.css">
  <link rel="stylesheet" href="css/w2k.css">
</head>
<body class="booting theme-classic wall-teal">
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var os = q.get('os');
      if (os !== '98' && os !== 'xp' && os !== '7' && os !== '9' && os !== '2k' && os !== '2000') {
        try { os = localStorage.getItem('winemulator.os'); } catch (e) {}
      }
      if (os !== '98' && os !== 'xp' && os !== '7' && os !== '9' && os !== '2k' && os !== '2000') os = '98';
      if (os === '2000') os = '2k';
      try { localStorage.setItem('winemulator.os', os); } catch (e) {}

      /* Give each desktop its own default look the first time it is opened. */
      if (os === '9') {
        try {
          var raw9 = localStorage.getItem('winemulator.settings');
          var st9 = raw9 ? JSON.parse(raw9) : {};
          var changed9 = false;
          if (!st9.wallpaper || st9.wallpaper === 'teal' || st9.wallpaper === 'bliss' || st9.wallpaper === 'harmony') { st9.wallpaper = 'hero'; changed9 = true; }
          if (!st9.theme || ['classic', 'platinum', 'midnight', 'xp', 'olive', 'silver', 'aero', 'frost', 'dusk'].indexOf(st9.theme) > -1) { st9.theme = 'win10'; changed9 = true; }
          if (changed9) localStorage.setItem('winemulator.settings', JSON.stringify(st9));
        } catch (e) {}
      } else if (os === '2k') {
        document.body.classList.remove('theme-classic', 'wall-teal');
        document.body.classList.add('theme-classic', 'wall-teal');
        var meta2k = document.querySelector('meta[name="theme-color"]');
        if (meta2k) meta2k.setAttribute('content', '#000080');
        document.title = 'WINemulator 2000 \u2014 Windows in your browser';
      } else if (os === '7') {
        try {
          var raw = localStorage.getItem('winemulator.settings');
          var st = raw ? JSON.parse(raw) : {};
          var changed = false;
          if (!st.wallpaper || st.wallpaper === 'teal' || st.wallpaper === 'bliss' || st.wallpaper === 'hero') { st.wallpaper = 'harmony'; changed = true; }
          if (!st.theme || ['classic', 'platinum', 'midnight', 'xp', 'olive', 'silver', 'win10'].indexOf(st.theme) > -1) { st.theme = 'aero'; changed = true; }
          if (changed) localStorage.setItem('winemulator.settings', JSON.stringify(st));
        } catch (e) {}
      } else if (os === '2k') {
        try {
          var raw2k = localStorage.getItem('winemulator.settings');
          var st2k = raw2k ? JSON.parse(raw2k) : {};
          var changed2k = false;
          if (!st2k.wallpaper || st2k.wallpaper === 'bliss' || st2k.wallpaper === 'harmony' || st2k.wallpaper === 'hero') { st2k.wallpaper = 'teal'; changed2k = true; }
          if (!st2k.theme || ['classic','platinum','midnight','xp','olive','silver','aero','frost','dusk','win10'].indexOf(st2k.theme) > -1) { st2k.theme = 'classic'; changed2k = true; }
          if (changed2k) localStorage.setItem('winemulator.settings', JSON.stringify(st2k));
        } catch (e) {}
      } else if (os === 'xp') {
        try {
          var rawX = localStorage.getItem('winemulator.settings');
          var stX = rawX ? JSON.parse(rawX) : {};
          var changedX = false;
          if (!stX.wallpaper || stX.wallpaper === 'teal' || stX.wallpaper === 'harmony') { stX.wallpaper = 'bliss'; changedX = true; }
          if (!stX.theme || ['classic', 'platinum', 'midnight', 'aero', 'frost', 'dusk'].indexOf(stX.theme) > -1) { stX.theme = 'xp'; changedX = true; }
          if (changedX) localStorage.setItem('winemulator.settings', JSON.stringify(stX));
        } catch (e) {}
      }

      window.WIN_OS = os;
      document.documentElement.setAttribute('data-os', os);
      document.body.classList.add(os === '9' ? 'os-9' : os === '7' ? 'os-7' : os === 'xp' ? 'os-xp' : os === '2k' ? 'os-2k' : 'os-98');
      if (os === 'xp') {
        document.body.classList.remove('theme-classic', 'wall-teal');
        document.body.classList.add('theme-xp', 'wall-bliss');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', '#245edb');
        document.title = 'WINemulator XP — Windows in your browser';
      } else if (os === '2k') {
        document.body.classList.remove('theme-classic', 'wall-teal');
        document.body.classList.add('theme-classic', 'wall-teal');
        var meta2k = document.querySelector('meta[name="theme-color"]');
        if (meta2k) meta2k.setAttribute('content', '#000080');
        document.title = 'WINemulator 2000 \u2014 Windows in your browser';
      } else if (os === '7') {
        document.body.classList.remove('theme-classic', 'wall-teal');
        document.body.classList.add('theme-aero', 'wall-harmony');
        var meta7 = document.querySelector('meta[name="theme-color"]');
        if (meta7) meta7.setAttribute('content', '#0b6d8f');
        document.title = 'WINemulator 7 — Windows in your browser';
      } else if (os === '9') {
        document.body.classList.remove('theme-classic', 'wall-teal');
        document.body.classList.add('theme-win10', 'wall-hero');
        var meta9 = document.querySelector('meta[name="theme-color"]');
        if (meta9) meta9.setAttribute('content', '#0078d7');
        document.title = 'WINemulator 9 — Windows in your browser';
      }
    })();
  </script>

  <main id="desktop" aria-label="Desktop">
    <div id="icons" aria-label="Desktop icons"></div>
    <div id="windows"></div>
    <div id="snap-preview" hidden></div>
  </main>

  <div id="taskbar" role="toolbar" aria-label="Taskbar">
    <button id="start-button" class="start-button" type="button" aria-expanded="false" aria-controls="start-menu">
      <span id="start-icon" aria-hidden="true"></span><span class="start-label">Start</span>
    </button>
    <div id="quicklaunch" class="quicklaunch" aria-label="Quick Launch"></div>
    <div id="tasks" class="tasks" aria-label="Running programs"></div>
    <div id="tray" class="tray">
      <button id="tray-volume" class="tray-btn" type="button" title="Volume" aria-label="Volume"></button>
      <button id="tray-network" class="tray-btn" type="button" title="Network connection" aria-label="Network connection"></button>
      <button id="tray-clock" class="tray-clock" type="button" title="Date and time"></button>
    </div>
  </div>

  <div id="start-menu" class="start-menu" hidden></div>
  <div id="alttab" class="alttab" hidden></div>
  <div id="calendar-pop" class="calendar-pop" hidden></div>
  <div id="volume-pop" class="volume-pop" hidden></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="crt" hidden></div>

  <div id="boot-layer" class="boot-layer" aria-label="Boot screen"></div>
  <div id="login-layer" class="login-layer" hidden></div>
  <div id="power-layer" class="power-layer" hidden></div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:99999;background:#000;color:#ddd;display:flex;align-items:center;justify-content:center;font:14px monospace;padding:30px;text-align:center">
      WINemulator needs JavaScript enabled to boot. Please enable JavaScript and reload.
    </div>
  </noscript>

  <script src="js/icons.js"></script>
  <script src="js/os.js"></script>
  <script src="js/icons-xp.js"></script>
  <script src="js/icons-7.js"></script>
  <script src="js/icons-10.js"></script>
  <script src="js/util.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fs.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/wm.js"></script>
  <script src="js/taskbar.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/boot.js"></script>
  <script src="js/apps/explorer.js"></script>
  <script src="js/apps/notepad.js"></script>
  <script src="js/apps/paint.js"></script>
  <script src="js/apps/calc.js"></script>
  <script src="js/apps/terminal.js"></script>
  <script src="js/apps/minesweeper.js"></script>
  <script src="js/apps/platformer.js"></script>
  <script src="js/apps/settings.js"></script>
  <script src="js/apps/taskmgr.js"></script>
  <script src="js/apps/browser.js"></script>
<script src="js/apps/firefox.js"></script>
  <script src="js/apps/help.js"></script>
  <script src="js/apps/vpc.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
