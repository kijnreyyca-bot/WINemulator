<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Abstract blue desktop wallpaper">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#04203f"/>
      <stop offset="0.55" stop-color="#074a86"/>
      <stop offset="1" stop-color="#0a6bb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.82" r="0.9">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1c7bd0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#04182f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#2b8fe0" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec8ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0b4f8a" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <g filter="url(#soft)" opacity="0.85">
    <path d="M-120 980 L620 300 L980 300 L240 980 Z" fill="url(#ribbon)"/>
    <path d="M420 1080 L1160 400 L1500 400 L760 1080 Z" fill="url(#ribbon2)"/>
    <path d="M980 1080 L1720 360 L1960 400 L1220 1080 Z" fill="url(#ribbon)" opacity="0.7"/>
  </g>

  <g opacity="0.75">
    <path d="M-40 1040 L700 360 L775 360 L35 1040 Z" fill="#bfe9ff" opacity="0.12"/>
    <path d="M520 1080 L1260 400 L1315 400 L575 1080 Z" fill="#d8f4ff" opacity="0.09"/>
    <path d="M1080 1080 L1820 400 L1875 400 L1135 1080 Z" fill="#bfe9ff" opacity="0.08"/>
  </g>

  <g opacity="0.35">
    <circle cx="1560" cy="220" r="3.5" fill="#e6f7ff"/>
    <circle cx="1660" cy="330" r="2.4" fill="#e6f7ff"/>
    <circle cx="1420" cy="150" r="2" fill="#e6f7ff"/>
    <circle cx="300" cy="180" r="2.6" fill="#e6f7ff"/>
    <circle cx="420" cy="120" r="1.8" fill="#e6f7ff"/>
    <circle cx="1780" cy="560" r="2.2" fill="#e6f7ff"/>
  </g>

  <rect width="1920" height="1080" fill="#02101f" opacity="0.16"/>
</svg>
