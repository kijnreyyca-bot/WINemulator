<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Driving Simulator - Open World</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="menu">
  <h1>3D Driving Simulator</h1>
  <p>Open world - weather & water</p>
  <div class="row"><label>Seed:</label><input id="seed" type="number" value="12345"></div>
  <button id="play">PLAY</button>
  <button id="garagebtn">GARAGE</button>
  <button id="quit">QUIT</button>
  <div id="garage" style="display:none;">
    <h2>Vehicle Garage</h2>
    <div class="veh-grid" id="vehgrid"></div>
    <button id="backmenu">Back</button>
  </div>
</div>
<div id="hud" style="display:none;">
  <div class="speed">0 km/h</div>
  <div class="speedbar" style="width:200px; height:8px; background:rgba(255,255,255,0.2); margin-top:4px; border-radius:4px; overflow:hidden;">
    <div class="speedfill" style="width:0%; height:100%; background:#00b4d8; transition:width 0.1s;"></div>
  </div>
  <div class="rpm"><div></div></div>
  <div class="gear">Gear: 1</div>
  <div>Damage: <span class="dmg">0%</span> <span class="cond"></span></div>
  <div class="bar"><div class="dmgbar"></div></div>
  <div>Smoke: <span class="smoke">None</span></div>
  <div>Nitro: <span class="nitro">100%</span></div>
  <div class="nitrobar"><div class="nitrofill"></div></div>
  <div>Distance: <span class="dist">0 m</span></div>
  <div>Weather: <span class="weather">Clear</span></div>
  <div class="controls">W/S accel/brake  A/D steer  Space handbrake  N nitro  R reset  C camera  V weather  L headlights</div>
</div>
<div id="seedinfo"></div>
<canvas id="minimap" width="180" height="180"></canvas>
<div id="destroyed">VEHICLE DESTROYED</div>

<!-- 1. Load Three.js Library first -->
<script src="three.min.js"></script>

<!-- 2. Load Procedural Textures generator -->
<script src="textures.js"></script>

<!-- 3. Load Custom Vehicle Models -->
<script src="car.js"></script>

<!-- 4. Load Core Game Logic and Physics Engine last -->
<script src="game.js"></script>
</body>
</html>
