  <link rel="icon" href="assets/favicon.png" type="image/png">

  <meta property="og:title" content="WINemulator">
  <meta property="og:description" content="A complete desktop in your browser. Choose VI OS Golden Gate, Windows 98, 2000, XP, 7 or 9. Boots in seconds, works offline, no installs.">

</head>
<body class="booting theme-classic wall-teal">
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var os = q.get('os');
      var aliases = { vi: 'mac', osx: 'mac', mvi: 'mac', macos: 'mac', 2000: '2k' };
      var valid = ['98', 'xp', '7', '9', '2k', 'dos', 'mac'];
      if (valid.indexOf(os) < 0 && aliases[os]) os = aliases[os];
      if (valid.indexOf(os) < 0) {
        try { os = localStorage.getItem('winemulator.os'); } catch (e) {}
        if (os && aliases[os]) os = aliases[os];
      }
      if (valid.indexOf(os) < 0) os = '98';
      try { localStorage.setItem('winemulator.os', os); } catch (e) {}

      /* Give each desktop its own default look the first time it is opened. */
      var genericWalls = ['teal', 'clouds', 'azure', 'sunset', 'graphite', 'grid', 'solid'];
      var conf = {
        mac: { theme: 'vi', wall: 'gate', themes: ['vi', 'vi-dark', 'vi-graphite'], walls: ['gate', 'dune', 'aurora', 'graphite', 'solid'] },
        '9': { theme: 'win10', wall: 'hero', themes: ['win10', 'win10mint', 'win10violet'], walls: genericWalls.concat(['hero']) },
        '7': { theme: 'aero', wall: 'harmony', themes: ['aero', 'frost', 'dusk'], walls: genericWalls.concat(['harmony']) },
        '2k': { theme: 'classic', wall: 'teal', themes: ['classic', 'platinum', 'midnight'], walls: genericWalls },
        dos: { theme: 'classic', wall: 'teal', themes: ['classic', 'platinum', 'midnight'], walls: genericWalls },
        xp: { theme: 'xp', wall: 'bliss', themes: ['xp', 'olive', 'silver'], walls: genericWalls.concat(['bliss']) },
        '98': { theme: 'classic', wall: 'teal', themes: ['classic', 'platinum', 'midnight'], walls: genericWalls }
      }[os];
      try {
        var raw = localStorage.getItem('winemulator.settings');
        var st = raw ? JSON.parse(raw) : {};
        var changed = false;
        if (conf.themes.indexOf(st.theme) < 0) { st.theme = conf.theme; changed = true; }
        if (conf.walls.indexOf(st.wallpaper) < 0) { st.wallpaper = conf.wall; changed = true; }
        if (changed) localStorage.setItem('winemulator.settings', JSON.stringify(st));
      } catch (e) {}

      window.WIN_OS = os;
      document.documentElement.setAttribute('data-os', os);
      document.body.className = 'booting os-' + os + ' theme-' + conf.theme + ' wall-' + conf.wall;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (os === 'mac') {
        if (meta) meta.setAttribute('content', '#0a84ff');
        document.title = 'VI OS 26 Golden Gate — WINemulator';
      } else if (os === 'xp') {
        if (meta) meta.setAttribute('content', '#245edb');
        document.title = 'WINemulator XP — Windows in your browser';
      } else if (os === '2k') {
        if (meta) meta.setAttribute('content', '#000080');
        document.title = 'WINemulator 2000 — Windows in your browser';
      } else if (os === 'dos') {
        if (meta) meta.setAttribute('content', '#000000');
        document.title = 'WINemulator DOS — MS-DOS in your browser';
      } else if (os === '7') {
        if (meta) meta.setAttribute('content', '#0b6d8f');
        document.title = 'WINemulator 7 — Windows in your browser';
      } else if (os === '9') {
        if (meta) meta.setAttribute('content', '#0078d7');
        document.title = 'WINemulator 9 — Windows in your browser';
      }
    })();
  </script>

  <main id="desktop" aria-label="Desktop">
    <div id="icons" aria-label="Desktop icons"></div>
    <div id="windows"></div>
    <div id="snap-preview" hidden></div>
  </main>

  <div id="taskbar" role="toolbar" aria-label="Taskbar">
    <button id="start-button" class="start-button" type="button" aria-expanded="false" aria-controls="start-menu">
      <span id="start-icon" aria-hidden="true"></span><span class="start-label">Start</span>
    </button>
    <div id="quicklaunch" class="quicklaunch" aria-label="Quick Launch"></div>
    <div id="tasks" class="tasks" aria-label="Running programs"></div>
    <div id="tray" class="tray">
      <button id="tray-volume" class="tray-btn" type="button" title="Volume" aria-label="Volume"></button>
      <button id="tray-network" class="tray-btn" type="button" title="Network connection" aria-label="Network connection"></button>
      <button id="tray-clock" class="tray-clock" type="button" title="Date and time"></button>
    </div>
  </div>

  <div id="start-menu" class="start-menu" hidden></div>
  <div id="alttab" class="alttab" hidden></div>
  <div id="calendar-pop" class="calendar-pop" hidden></div>
  <div id="volume-pop" class="volume-pop" hidden></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="crt" hidden></div>

  <div id="boot-layer" class="boot-layer" aria-label="Boot screen"></div>
  <div id="login-layer" class="login-layer" hidden></div>
  <div id="power-layer" class="power-layer" hidden></div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:99999;background:#000;color:#ddd;display:flex;align-items:center;justify-content:center;font:14px monospace;padding:30px;text-align:center">
      WINemulator needs JavaScript enabled to boot. Please enable JavaScript and reload.
    </div>
  </noscript>
